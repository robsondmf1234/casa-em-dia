name: Android CI

on:
  # 1. Roda quando um PR é aberto, sincronizado ou reaberto tendo como ALVO a main ou develop
  pull_request:
    branches: [ "main", "develop" ]

  # 2.  Roda quando um código é "mergeado" diretamente na main (um merge é interpretado como um push)
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # O google-services.json real não fica no repositório (.gitignore). No CI usamos um
      # arquivo fictício só para o plugin do Google Services compilar; o login não funciona nele.
      - name: Provide placeholder google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.ci.json app/google-services.json
          fi

      - name: Build project
        run: ./gradlew assembleDebug

      - name: Run tests
        run: ./gradlew test
